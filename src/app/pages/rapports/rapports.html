<div class="rapports-page">
  <div class="page-header">
    <span class="kicker">Exportation</span>
    <h1>Rapports</h1>
    <p class="subtitle">Exportez vos données</p>
  </div>

  <p class="succes-message" *ngIf="messageSucces">{{ messageSucces }}</p>
  <p class="error-message" *ngIf="errorMessage">{{ errorMessage }}</p>
  <p *ngIf="isLoading">Génération en cours...</p>

  <div class="rapports-grid">
    <div class="rapport-card">
      <h3>Rapport des stocks</h3>
      <p>État complet des stocks sur tous les entrepôts</p>
      <div class="rapport-actions">
        <button class="btn-export" (click)="exporterStocks()" [disabled]="isLoading">
          Exporter stocks
        </button>
      </div>
    </div>

    <div class="rapport-card">
      <h3>Rapport des mouvements</h3>
      <p>Historique des entrées, sorties et transferts</p>
      <div class="rapport-actions">
        <button class="btn-export" (click)="exporterMouvements()" [disabled]="isLoading">
          Exporter mouvements
        </button>
      </div>
    </div>
  </div>
</div>
