<div class="dashboard">
  <div class="dashboard-header">
    <span class="kicker">Vue d'ensemble</span>
    <h1>Tableau de bord</h1>
  </div>

  <div class="stats-grid">
    <div class="stat-card" *ngFor="let stat of stats">
      <span class="stat-value">{{ stat.value }}</span>
      <span class="stat-label">{{ stat.label }}</span>
    </div>
  </div>

  <div class="dashboard-grid">
    <div class="panel">
      <h2>Répartition par entrepôt</h2>
      <div class="bars">
        <div class="bar-row" *ngFor="let entrepot of repartitionEntrepots">
          <span class="bar-label">{{ entrepot.nom }}</span>
          <div class="bar-track">
            <div class="bar-fill" [style.width.%]="entrepot.pourcentage"></div>
          </div>
          <span class="bar-value">{{ entrepot.pourcentage }}%</span>
        </div>
      </div>
    </div>

    <div class="panel">
      <h2>Alertes de seuil minimum</h2>
      <div class="alert-list">
        <div class="alert-item" *ngFor="let alerte of alertes">
          <div class="alert-info">
            <span class="alert-article">{{ alerte.article }}</span>
            <span class="alert-entrepot">{{ alerte.entrepot }}</span>
          </div>
          <span class="alert-badge" [class.rupture]="alerte.niveau === 0">
            {{ alerte.niveau }} / {{ alerte.seuil }}
          </span>
        </div>
      </div>
    </div>
  </div>
</div>
