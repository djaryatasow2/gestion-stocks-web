<div class="login-page">
  <div class="login-panel">
    <div class="brand">
      <div class="brand-mark"></div>
      <h1 class="brand-name">SMART<span>MS</span></h1>
      <p class="brand-tagline"><em>Gestion intelligente des stocks</em></p>
    </div>

    <form class="login-form" (ngSubmit)="onSubmit()" #loginForm="ngForm">
      <div class="form-field">
        <label for="username">Nom d'utilisateur</label>
        <input
          type="text"
          id="username"
          name="username"
          [(ngModel)]="username"
          placeholder="votre nom d'utilisateur"
          autocomplete="username"
          required
        />
      </div>

      <div class="form-field">
        <label for="password">Mot de passe</label>
        <div class="password-wrapper">
          <input
            [type]="showPassword ? 'text' : 'password'"
            id="password"
            name="password"
            [(ngModel)]="password"
            placeholder="••••••••"
            autocomplete="current-password"
            required
          />
          <button type="button" class="toggle-visibility" (click)="togglePassword()">
            {{ showPassword ? 'Masquer' : 'Afficher' }}
          </button>
        </div>
      </div>

      <p class="error-message" *ngIf="errorMessage">{{ errorMessage }}</p>

      <button type="submit" class="btn-submit" [disabled]="isLoading">
        <span *ngIf="!isLoading">Se connecter</span>
        <span *ngIf="isLoading" class="loader"></span>
      </button>
    </form>

    <p class="footer-note">SMART MS SA &mdash; Nouakchott, Mauritanie</p>
  </div>

  <div class="login-visual">
    <div class="visual-content">
      <span class="visual-kicker">Plateforme entreprise</span>
      <h2>Une vision claire<br />de vos stocks, <em>partout</em>.</h2>
      <p>Suivi en temps réel, alertes intelligentes et prévisions pour l'ensemble de vos entrepôts.</p>
      <div class="visual-divider"></div>
      <div class="visual-stats">
        <div>
          <span class="stat-number">+12</span>
          <span class="stat-label">Entreprises</span>
        </div>
        <div>
          <span class="stat-number">24/7</span>
          <span class="stat-label">Suivi continu</span>
        </div>
      </div>
    </div>
  </div>
</div>
