<div class="profile-page">
  <div class="page-header">
    <span class="kicker">Compte</span>
    <h1>Mon profil</h1>
  </div>

  <div class="profile-top">
    <div class="avatar-large">{{ initiales }}</div>
    <div>
      <h2>{{ username }}</h2>
      <span class="role-badge">{{ getRoleLabel() }}</span>
    </div>
  </div>

  <p class="message succes" *ngIf="message && messageType === 'succes'">{{ message }}</p>
  <p class="message erreur" *ngIf="message && messageType === 'erreur'">{{ message }}</p>

  <div class="profile-grid">
    <div class="panel">
      <h3>Informations</h3>
      <div class="form-field">
        <label>Nom d'utilisateur</label>
        <input type="text" [value]="username" disabled />
      </div>
      <div class="form-field">
        <label>Rôle</label>
        <input type="text" [value]="getRoleLabel()" disabled />
      </div>
      <button class="btn-danger" (click)="deconnexion()">Se déconnecter</button>
    </div>

    <div class="panel">
      <h3>Changer le mot de passe</h3>
      <div class="form-field">
        <label>Mot de passe actuel</label>
        <input type="password" [(ngModel)]="ancienMotDePasse" />
      </div>
      <div class="form-field">
        <label>Nouveau mot de passe</label>
        <input type="password" [(ngModel)]="nouveauMotDePasse" />
      </div>
      <div class="form-field">
        <label>Confirmer</label>
        <input type="password" [(ngModel)]="confirmationMotDePasse" />
      </div>
      <button class="btn-primary" (click)="changerMotDePasse()">Modifier</button>
    </div>
  </div>
</div>
